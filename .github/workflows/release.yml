name: Build and publish releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            archive: zip
          - platform: linux
            os: ubuntu-latest
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --update-snapshots package

      - name: Locate application JAR
        id: jar
        shell: bash
        run: |
          jar_path="$(find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          if [ -z "$jar_path" ]; then
            echo "No application JAR was found in target/" >&2
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar_path")" >> "$GITHUB_OUTPUT"

      - name: Create portable Windows app-image
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/input | Out-Null
          Copy-Item "${{ steps.jar.outputs.path }}" dist/input/
          jpackage `
            --type app-image `
            --input dist/input `
            --name CalculaFacil `
            --main-jar "${{ steps.jar.outputs.name }}" `
            --main-class com.calculafacil.App `
            --dest dist
          Compress-Archive -Path dist/CalculaFacil -DestinationPath "CalculaFacil-${{ github.ref_name }}-windows.zip"

      - name: Create portable Linux app-image
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p dist/input
          cp "${{ steps.jar.outputs.path }}" dist/input/
          jpackage \
            --type app-image \
            --input dist/input \
            --name CalculaFacil \
            --main-jar "${{ steps.jar.outputs.name }}" \
            --main-class com.calculafacil.App \
            --dest dist
          tar -C dist -czf "CalculaFacil-${{ github.ref_name }}-linux.tar.gz" CalculaFacil

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalculaFacil-${{ matrix.platform }}
          path: CalculaFacil-${{ github.ref_name }}-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: CalculaFacil-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --generate-notes \
            --title "Calcula Fácil ${{ github.ref_name }}"
